<div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
        <h2 class="text-3xl font-black text-slate-800 tracking-tight">Mis Pacientes</h2>
        <p class="text-slate-500 font-medium mt-1">Pacientes asignados a tu tratamiento activo</p>
    </div>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="py-4 px-6 text-xs font-bold uppercase tracking-wider text-slate-500">Paciente</th>
                    <th class="py-4 px-6 text-xs font-bold uppercase tracking-wider text-slate-500">Contacto</th>
                    <th class="py-4 px-6 text-xs font-bold uppercase tracking-wider text-slate-500 text-center w-32">
                        Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr *ngFor="let p of pacientes" class="hover:bg-slate-50/80 transition-colors group">
                    <td class="py-4 px-6">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 border border-blue-200 font-bold uppercase shrink-0">
                                {{ p.nombres.charAt(0) }}
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">{{ p.nombres }}</p>
                                <p class="text-xs text-slate-500">ID Local: {{ p.id }}</p>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        <p class="text-slate-600 font-medium">{{ p.email }}</p>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <a [routerLink]="['/fisioterapeuta/pacientes', p.id]"
                            class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-700 px-3 py-1.5 rounded-lg border border-slate-200 hover:border-blue-200 transition-all font-semibold text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9zm3.75 11.625a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                            </svg>
                            Detalles
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="pacientes.length === 0" class="p-12 text-center flex flex-col items-center justify-center">
        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-8 h-8 text-slate-400">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
            </svg>
        </div>
        <p class="text-slate-500 font-medium">No tienes pacientes asignados actualmente.</p>
    </div>
</div>
